<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barfi Photo Gallery</title>
    <meta
      name="description"
      content="A cute slideshow gallery of Barfi the Maltipoo with auto play and side controls."
    />
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: rgba(255, 252, 246, 0.9);
        --ink: #263243;
        --muted: #6c7480;
        --accent: #e86f8a;
        --accent2: #78c8ba;
        --accent3: #f1c75b;
        --line: rgba(38, 50, 67, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(232,111,138,0.18), transparent 24rem),
          radial-gradient(circle at 85% 10%, rgba(120,200,186,0.22), transparent 26rem),
          linear-gradient(135deg, #f9f5ee 0%, #eef8f5 50%, #fff6ea 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 5.5rem minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem;
      }

      .rail {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1rem;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--panel);
        box-shadow: 0 1rem 2.5rem rgba(38, 50, 67, 0.08);
      }

      .rail button,
      .rail a {
        width: 3.2rem;
        height: 3.2rem;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: #263243;
        color: #fff;
        text-decoration: none;
        font-size: 1.35rem;
        cursor: pointer;
        box-shadow: 0 0.65rem 1.25rem rgba(38, 50, 67, 0.18);
      }

      .rail .ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .gallery {
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--panel);
        box-shadow: 0 1rem 2.5rem rgba(38, 50, 67, 0.08);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: calc(100vh - 2rem);
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: end;
        padding: 1.25rem 1.5rem 1rem;
        border-bottom: 1px solid var(--line);
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0.45rem 0 0;
        color: var(--muted);
        max-width: 55ch;
        line-height: 1.55;
      }

      .status {
        white-space: nowrap;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(18rem, 0.9fr);
        min-height: 0;
      }

      .frame {
        position: relative;
        margin: 1rem;
        border-radius: 1.25rem;
        overflow: hidden;
        background: #111;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .photo {
        width: 100%;
        height: 100%;
        min-height: 28rem;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 320ms ease;
      }

      .photo.is-visible { opacity: 1; }

      .badge {
        position: absolute;
        left: 1rem;
        top: 1rem;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        background: rgba(255,255,255,0.85);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .caption {
        display: grid;
        align-content: center;
        gap: 1rem;
        padding: 1.5rem 1.5rem 1.5rem 0;
      }

      .caption h2 {
        margin: 0;
        font-size: clamp(1.9rem, 4vw, 3rem);
        line-height: 1.02;
      }

      .caption p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 1.08rem;
        max-width: 34ch;
      }

      .caption .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.42rem 0.7rem;
        background: rgba(255,255,255,0.7);
      }

      .thumbs {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 0.65rem;
        padding: 0 1rem 1rem;
        overflow: auto;
        border-top: 1px solid var(--line);
        background: rgba(255,255,255,0.35);
      }

      .thumb {
        position: relative;
        border: 0;
        padding: 0;
        border-radius: 0.7rem;
        overflow: hidden;
        background: #ddd;
        aspect-ratio: 1 / 1;
        cursor: pointer;
        box-shadow: 0 0.5rem 1rem rgba(38, 50, 67, 0.09);
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0.92;
      }

      .thumb.is-active {
        outline: 3px solid var(--accent);
        outline-offset: 0;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .rail {
          order: 2;
          flex-direction: row;
          justify-content: space-between;
          padding: 0.9rem;
        }

        .gallery {
          min-height: auto;
        }

        .stage {
          grid-template-columns: 1fr;
        }

        .caption {
          padding: 0 1.5rem 1.2rem;
        }

        .thumbs {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        header {
          align-items: start;
          flex-direction: column;
        }

        .thumbs {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .photo {
          min-height: 22rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="rail" aria-label="Gallery controls">
        <button id="prev" type="button" aria-label="Previous photo">‹</button>
        <a href="#top" class="ghost" aria-label="Jump to top">⌂</a>
        <button id="next" type="button" aria-label="Next photo">›</button>
      </nav>

      <section class="gallery" id="top">
        <header>
          <div>
            <h1 class="title">Barfi Gallery</h1>
            <p class="subtitle">
              A little slideshow of Barfi being curious, cozy, and very cute.
              The gallery advances on its own every few seconds, and you can use
              the side buttons to move through the photos.
            </p>
          </div>
          <div class="status" id="status">Photo 1 of 27</div>
        </header>

        <section class="stage" aria-label="Barfi photo slideshow">
          <div class="frame">
            <div class="badge">Barfi the Maltipoo</div>
            <img id="slide" class="photo is-visible" alt="Barfi photo" />
          </div>

          <aside class="caption">
            <div class="meta">
              <span class="pill" id="mood">Playful</span>
              <span class="pill" id="place">At home</span>
              <span class="pill" id="time">Auto play on</span>
            </div>
            <h2 id="captionTitle"></h2>
            <p id="captionText"></p>
          </aside>
        </section>

        <section class="thumbs" id="thumbs" aria-label="Photo thumbnails"></section>
      </section>
    </main>

    <script>
      const slides = [
        {
          file: "assets/gallery-01.jpeg",
          title: "Tiny face, huge charm",
          text: "Barfi looks right at the camera like she knows she is the star of the whole room.",
          mood: "Curious",
          place: "Bedside",
        },
        {
          file: "assets/gallery-02.jpeg",
          title: "Ready for adventure",
          text: "Wrapped up and ready to go, Barfi brings her own little burst of joy to the trail.",
          mood: "Out exploring",
          place: "Nature walk",
        },
        {
          file: "assets/gallery-03.jpeg",
          title: "A soft landing",
          text: "Barfi and her tennis ball, proving that cozy moments can still be playtime.",
          mood: "Cozy",
          place: "Living room",
        },
        {
          file: "assets/gallery-04.jpeg",
          title: "Window seat queen",
          text: "She sits up tall like she is supervising the world from the passenger seat.",
          mood: "Proud",
          place: "Car ride",
        },
        {
          file: "assets/gallery-05.jpeg",
          title: "Forest mode",
          text: "A fresh jacket, a leash, and a forest backdrop make Barfi look picture perfect.",
          mood: "Exploring",
          place: "Wooded trail",
        },
        {
          file: "assets/gallery-06.jpeg",
          title: "Bedtime buddy",
          text: "Barfi keeps watch from the middle of the bed, comfy and completely content.",
          mood: "Resting",
          place: "Bedroom",
        },
        {
          file: "assets/gallery-07.jpeg",
          title: "Parking-garage glam",
          text: "Even in a car, Barfi finds a way to look like a little celebrity on the move.",
          mood: "Stylish",
          place: "In transit",
        },
        {
          file: "assets/gallery-08.jpeg",
          title: "Sweet sofa portrait",
          text: "Barfi pauses on the couch with the kind of face that could melt a whole afternoon.",
          mood: "Gentle",
          place: "Living room",
        },
        {
          file: "assets/gallery-09.jpeg",
          title: "Blanket fort royalty",
          text: "Wrapped in warm colors, Barfi looks like she has claimed the coziest spot in the house.",
          mood: "Snuggly",
          place: "On the bed",
        },
        {
          file: "assets/gallery-10.jpeg",
          title: "Pink-perfumed perfection",
          text: "Nested in a soft pink bed, Barfi gives a very convincing performance of 'I live here now.'",
          mood: "Relaxed",
          place: "Car seat",
        },
        {
          file: "assets/gallery-11.jpeg",
          title: "City stroll sparkle",
          text: "The bright sign behind her only makes Barfi shine more as she explores the plaza.",
          mood: "Adventurous",
          place: "Downtown",
        },
        {
          file: "assets/gallery-12.jpeg",
          title: "Looking back with love",
          text: "Barfi turns to check on her person, because every great outing needs a little reassurance.",
          mood: "Affectionate",
          place: "Car ride",
        },
        {
          file: "assets/gallery-13.jpeg",
          title: "Sunlit floof alert",
          text: "A cozy carpet, soft light, and Barfi doing her best fluffy sculpture impression.",
          mood: "Soft",
          place: "Home",
        },
        {
          file: "assets/gallery-14.jpeg",
          title: "Big wave energy",
          text: "Barfi raises a paw like she is greeting the whole gallery with a tiny hello.",
          mood: "Friendly",
          place: "Outdoors",
        },
        {
          file: "assets/gallery-15.jpeg",
          title: "Little explorer pose",
          text: "She stands in the open air like she has a map in her head and a mission to enjoy the day.",
          mood: "Exploring",
          place: "Trail",
        },
        {
          file: "assets/gallery-16.jpeg",
          title: "Rails and sunshine",
          text: "Barfi waits by the tracks like a patient traveler with excellent taste in backdrops.",
          mood: "Calm",
          place: "Station",
        },
        {
          file: "assets/gallery-17.jpeg",
          title: "Sidewalk superstar",
          text: "A bright patch of grass, a little shadow, and Barfi looking impossibly photogenic.",
          mood: "Fresh",
          place: "Neighborhood walk",
        },
        {
          file: "assets/gallery-18.jpeg",
          title: "Top-down cutie",
          text: "Seen from above, Barfi looks like a tidy little cloud with paws and a tail.",
          mood: "Playful",
          place: "Living room",
        },
        {
          file: "assets/gallery-19.jpeg",
          title: "Holiday hallway star",
          text: "Barfi stands under the festive greenery looking like the invited guest everyone wanted to see.",
          mood: "Festive",
          place: "Downtown",
        },
        {
          file: "assets/gallery-20.jpeg",
          title: "Night bench elegance",
          text: "Under the city lights, Barfi turns into a tiny evening portrait with a soft expression.",
          mood: "Elegant",
          place: "Night walk",
        },
        {
          file: "assets/gallery-21.jpeg",
          title: "Strong little sit",
          text: "Barfi on the boardwalk, holding a pose that says she knows exactly what she is doing.",
          mood: "Confident",
          place: "Boardwalk",
        },
        {
          file: "assets/gallery-22.jpeg",
          title: "Mountain backdrop moment",
          text: "Clear blue sky, rocky hills, and Barfi looking like the cutest hiking companion around.",
          mood: "Outdoorsy",
          place: "Scenic overlook",
        },
        {
          file: "assets/gallery-23.jpeg",
          title: "Happy floor loaf",
          text: "A warm rug, a curious look, and Barfi being wonderfully herself on the hardwood floor.",
          mood: "Homey",
          place: "Living room",
        },
        {
          file: "assets/gallery-24.jpeg",
          title: "Tiny shadow, big heart",
          text: "From above, Barfi becomes an adorable little shape of fluff against the carpet.",
          mood: "Calm",
          place: "Living room",
        },
        {
          file: "assets/gallery-25.jpeg",
          title: "Benchside pause",
          text: "Barfi takes a quiet seat and looks back with the kind of expression that always gets a smile.",
          mood: "Thoughtful",
          place: "Evening outing",
        },
        {
          file: "assets/gallery-26.jpeg",
          title: "National park cameo",
          text: "Barfi gives the park sign a very polite approval before continuing the adventure.",
          mood: "Touring",
          place: "Carlsbad Caverns",
        },
        {
          file: "assets/gallery-27.jpeg",
          title: "Texture and fluff",
          text: "Against the rustic wood, Barfi looks even softer and even more like a little puff of joy.",
          mood: "Serene",
          place: "Garden corner",
        },
      ];

      const slide = document.getElementById("slide");
      const captionTitle = document.getElementById("captionTitle");
      const captionText = document.getElementById("captionText");
      const status = document.getElementById("status");
      const thumbs = document.getElementById("thumbs");
      const mood = document.getElementById("mood");
      const place = document.getElementById("place");
      const time = document.getElementById("time");
      const next = document.getElementById("next");
      const prev = document.getElementById("prev");

      let index = 0;
      const intervalMs = 5000;
      let timer = null;

      function render() {
        const current = slides[index];
        slide.classList.remove("is-visible");
        requestAnimationFrame(() => {
          slide.src = current.file;
          slide.alt = current.title;
          captionTitle.textContent = current.title;
          captionText.textContent = current.text;
          status.textContent = `Photo ${index + 1} of ${slides.length}`;
          mood.textContent = current.mood;
          place.textContent = current.place;
          time.textContent = `Auto play every ${intervalMs / 1000}s`;
          document.querySelectorAll(".thumb").forEach((btn, i) => {
            btn.classList.toggle("is-active", i === index);
          });
          slide.onload = () => slide.classList.add("is-visible");
        });
      }

      function go(step) {
        index = (index + step + slides.length) % slides.length;
        render();
        restart();
      }

      function restart() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => go(1), intervalMs);
      }

      slides.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.className = "thumb";
        btn.type = "button";
        btn.setAttribute("aria-label", `Show photo ${i + 1}: ${item.title}`);
        btn.innerHTML = `<img src="${item.file}" alt="${item.title} thumbnail" />`;
        btn.addEventListener("click", () => {
          index = i;
          render();
          restart();
        });
        thumbs.appendChild(btn);
      });

      next.addEventListener("click", () => go(1));
      prev.addEventListener("click", () => go(-1));
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") go(1);
        if (event.key === "ArrowLeft") go(-1);
      });

      render();
      restart();
    </script>
  </body>
</html>
