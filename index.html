<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barfi Photo Gallery</title>
    <meta
      name="description"
      content="A cute slideshow gallery of Barfi the Maltipoo with auto play and side controls."
    />
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: rgba(255, 252, 246, 0.9);
        --ink: #263243;
        --muted: #6c7480;
        --accent: #e86f8a;
        --accent2: #78c8ba;
        --accent3: #f1c75b;
        --line: rgba(38, 50, 67, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(232,111,138,0.18), transparent 24rem),
          radial-gradient(circle at 85% 10%, rgba(120,200,186,0.22), transparent 26rem),
          linear-gradient(135deg, #f9f5ee 0%, #eef8f5 50%, #fff6ea 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 5.5rem minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem;
      }

      .rail {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1rem;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--panel);
        box-shadow: 0 1rem 2.5rem rgba(38, 50, 67, 0.08);
      }

      .rail button,
      .rail a {
        width: 3.2rem;
        height: 3.2rem;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: #263243;
        color: #fff;
        text-decoration: none;
        font-size: 1.35rem;
        cursor: pointer;
        box-shadow: 0 0.65rem 1.25rem rgba(38, 50, 67, 0.18);
      }

      .rail .ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .gallery {
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--panel);
        box-shadow: 0 1rem 2.5rem rgba(38, 50, 67, 0.08);
        overflow: hidden;
        display: grid;
        grid-template-rows: 1fr auto auto;
        min-height: calc(100vh - 2rem);
      }

      .status {
        padding: 0.7rem 0 0;
        white-space: nowrap;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
      }

      .stage {
        position: relative;
        display: grid;
        gap: 1rem;
        min-height: 0;
        padding: 1rem;
      }

      .frame {
        position: relative;
        margin: 0;
        border-radius: 1.25rem;
        overflow: hidden;
        background: #111;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .photo {
        width: 100%;
        height: 100%;
        min-height: 28rem;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 320ms ease;
      }

      .photo.is-visible { opacity: 1; }

      .caption {
        display: grid;
        align-content: start;
        gap: 0.45rem;
        padding: 0.25rem 0 0;
      }

      .caption h2 {
        margin: 0;
        font-size: clamp(1.9rem, 4vw, 3rem);
        line-height: 1.02;
      }

      .caption p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 1.08rem;
        max-width: 62ch;
      }

      .thumbs {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 0.65rem;
        padding: 0 1rem 1rem;
        overflow: auto;
        border-top: 1px solid var(--line);
        background: rgba(255,255,255,0.35);
      }

      .footer-note {
        padding: 0 1rem 1rem;
        margin: 0;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }

      .thumb {
        position: relative;
        border: 0;
        padding: 0;
        border-radius: 0.7rem;
        overflow: hidden;
        background: #ddd;
        aspect-ratio: 1 / 1;
        cursor: pointer;
        box-shadow: 0 0.5rem 1rem rgba(38, 50, 67, 0.09);
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0.92;
      }

      .thumb.is-active {
        outline: 3px solid var(--accent);
        outline-offset: 0;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .rail {
          order: 2;
          flex-direction: row;
          justify-content: space-between;
          padding: 0.9rem;
        }

        .gallery {
          min-height: auto;
        }

        .thumbs {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .thumbs {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .photo {
          min-height: 22rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="rail" aria-label="Gallery controls">
        <button id="prev" type="button" aria-label="Previous photo">‹</button>
        <a href="#top" class="ghost" aria-label="Jump to top">⌂</a>
        <button id="next" type="button" aria-label="Next photo">›</button>
      </nav>

      <section class="gallery" id="top">
        <section class="stage" aria-label="Barfi photo slideshow">
          <aside class="caption">
            <h2 id="captionTitle"></h2>
            <p id="captionText"></p>
          </aside>

          <div class="frame">
            <img id="slide" class="photo is-visible" alt="Barfi photo" />
          </div>
          <div class="status" id="status">Photo 1 of 27</div>
        </section>

        <section class="thumbs" id="thumbs" aria-label="Photo thumbnails"></section>
        <p class="footer-note">
          A cute slideshow of Barfi's photos. It plays on its own, and the
          side buttons let you move back and forth.
        </p>
      </section>
    </main>

    <script>
      const slides = [
        {
          file: "assets/gallery-01.jpeg",
          title: "Trail Captain Barfi",
          text: "Red jacket, wooden bench, forest path, and one tiny boss deciding where the walk goes next.",
          mood: "Trail boss",
          place: "Woodland bench",
        },
        {
          file: "assets/gallery-02.jpeg",
          title: "Streamside Sweetheart",
          text: "Barfi poses by the rushing water in her red coat, looking very brave for someone so fluffy.",
          mood: "Adventure mode",
          place: "By the stream",
        },
        {
          file: "assets/gallery-03.jpeg",
          title: "Polite Little Puff",
          text: "A tidy carpet sit with those round eyes that seem to ask, very sweetly, where the treats are.",
          mood: "Patient",
          place: "Carpet corner",
        },
        {
          file: "assets/gallery-04.jpeg",
          title: "Tiny Rug Inspector",
          text: "Barfi stands beside the patterned rug like she is supervising the whole living room with quiet authority.",
          mood: "Curious",
          place: "Living room floor",
        },
        {
          file: "assets/gallery-05.jpeg",
          title: "Boardwalk Thinker",
          text: "A thoughtful little side pose on the wooden boards, with a dramatic wall making Barfi look extra important.",
          mood: "Composed",
          place: "Boardwalk",
        },
        {
          file: "assets/gallery-06.jpeg",
          title: "Bedtime Close-Up",
          text: "Barfi leans into the camera from the bed, all curls, button nose, and soft little mystery.",
          mood: "Cuddly",
          place: "On the bed",
        },
        {
          file: "assets/gallery-07.jpeg",
          title: "Pink Blanket Passenger",
          text: "Tucked into a pink car blanket, Barfi looks cozy enough to turn every errand into a luxury ride.",
          mood: "Snug",
          place: "Car seat",
        },
        {
          file: "assets/gallery-08.jpeg",
          title: "Queen of the Bedspread",
          text: "A tiny white cloud resting on the big yellow bedspread, fully aware that comfort is serious business.",
          mood: "Relaxed",
          place: "Bedroom",
        },
        {
          file: "assets/gallery-09.jpeg",
          title: "Downtown Diva",
          text: "Barfi sits beneath the bright SLTX sign, looking small, stylish, and completely city-ready.",
          mood: "City star",
          place: "Downtown",
        },
        {
          file: "assets/gallery-10.jpeg",
          title: "Car Window Flower Girl",
          text: "Standing tall by the car window with a flower clip, Barfi gives main-character energy from the passenger side.",
          mood: "Fancy",
          place: "Car ride",
        },
        {
          file: "assets/gallery-11.jpeg",
          title: "Holiday Arch Cutie",
          text: "Red sweater, festive arch, tiny serious face: Barfi is clearly taking seasonal modeling very seriously.",
          mood: "Festive",
          place: "Holiday walkway",
        },
        {
          file: "assets/gallery-12.jpeg",
          title: "Sunshine Sidewalk Smile",
          text: "Barfi pauses by the bright green grass, half in sunshine and fully in adorable mode.",
          mood: "Sunny",
          place: "Sidewalk",
        },
        {
          file: "assets/gallery-13.jpeg",
          title: "Night Bench Princess",
          text: "On a dark bench with soft lights behind her, Barfi looks ready for a tiny evening portrait session.",
          mood: "Elegant",
          place: "Evening outing",
        },
        {
          file: "assets/gallery-14.jpeg",
          title: "Rustic Little Model",
          text: "Barfi sits in front of the textured wood wall, looking neat, calm, and quietly photogenic.",
          mood: "Poised",
          place: "Rustic wall",
        },
        {
          file: "assets/gallery-15.jpeg",
          title: "Mountain-View Muse",
          text: "With blue sky and mountains behind her, Barfi turns the rocky lookout into her personal photo set.",
          mood: "Scenic",
          place: "Mountain view",
        },
        {
          file: "assets/gallery-16.jpeg",
          title: "Desert Path Explorer",
          text: "Barfi stands outdoors against a wide blue sky, looking brave, bright, and wonderfully tiny in the landscape.",
          mood: "Explorer",
          place: "Outdoor trail",
        },
        {
          file: "assets/gallery-17.jpeg",
          title: "Blanket Fort Boss",
          text: "Nestled in orange blankets with a toy nearby, Barfi looks like she has claimed the coziest kingdom.",
          mood: "Snuggly",
          place: "Blanket nest",
        },
        {
          file: "assets/gallery-18.jpeg",
          title: "Carpet Hello",
          text: "Barfi looks up from the carpet with a tiny smile, as if she has been waiting politely for applause.",
          mood: "Sweet",
          place: "Carpet",
        },
        {
          file: "assets/gallery-19.jpeg",
          title: "Floofy Floor Flop",
          text: "A top-down sploot on the wood floor, starring Barfi's little body and magnificent puff tail.",
          mood: "Silly",
          place: "Wood floor",
        },
        {
          file: "assets/gallery-20.jpeg",
          title: "Sofa Daydreamer",
          text: "Sitting upright on the sofa, Barfi looks off to the side like she is planning something charming.",
          mood: "Thoughtful",
          place: "Sofa",
        },
        {
          file: "assets/gallery-21.jpeg",
          title: "Back-Seat Ballerina",
          text: "Barfi stretches tall in the car with perfect posture, giving the back seat a tiny runway moment.",
          mood: "Graceful",
          place: "Back seat",
        },
        {
          file: "assets/gallery-22.jpeg",
          title: "Purple Ball Bestie",
          text: "Barfi lounges with her purple ball, looking sweet, serious, and absolutely ready for another round.",
          mood: "Playful",
          place: "Carpet playtime",
        },
        {
          file: "assets/gallery-23.jpeg",
          title: "Window Watcher",
          text: "Standing tall in the car, Barfi watches the world outside with her fluffy tail stealing the show.",
          mood: "Alert",
          place: "Car window",
        },
        {
          file: "assets/gallery-24.jpeg",
          title: "Carlsbad Cameo",
          text: "Barfi sits by the Carlsbad Caverns sign like a tiny travel ambassador with excellent curls.",
          mood: "Tourist",
          place: "Carlsbad Caverns",
        },
        {
          file: "assets/gallery-25.jpeg",
          title: "Trackside Tiny Star",
          text: "On the train platform with tracks stretching behind her, Barfi makes the whole station look cuter.",
          mood: "Steady",
          place: "Train tracks",
        },
        {
          file: "assets/gallery-26.jpeg",
          title: "Nose-Lick Wave",
          text: "One paw up and tongue out, Barfi delivers the most charming little greeting beside the tall grass.",
          mood: "Funny",
          place: "Outdoor grass",
        },
        {
          file: "assets/gallery-27.jpeg",
          title: "Evening Bench Side-Eye",
          text: "A side-profile bench pose under soft evening lights, with Barfi looking tiny, tidy, and deeply important.",
          mood: "Dramatic",
          place: "Night bench",
        },
      ];

      const slide = document.getElementById("slide");
      const captionTitle = document.getElementById("captionTitle");
      const captionText = document.getElementById("captionText");
      const status = document.getElementById("status");
      const thumbs = document.getElementById("thumbs");
      const next = document.getElementById("next");
      const prev = document.getElementById("prev");

      let index = 0;
      const intervalMs = 4000;
      let timer = null;

      function render() {
        const current = slides[index];
        slide.classList.remove("is-visible");
        requestAnimationFrame(() => {
          slide.src = current.file;
          slide.alt = current.title;
          captionTitle.textContent = current.title;
          captionText.textContent = current.text;
          status.textContent = `Photo ${index + 1} of ${slides.length}`;
          document.querySelectorAll(".thumb").forEach((btn, i) => {
            btn.classList.toggle("is-active", i === index);
          });
          slide.onload = () => slide.classList.add("is-visible");
        });
      }

      function go(step) {
        index = (index + step + slides.length) % slides.length;
        render();
        restart();
      }

      function restart() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => go(1), intervalMs);
      }

      slides.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.className = "thumb";
        btn.type = "button";
        btn.setAttribute("aria-label", `Show photo ${i + 1}: ${item.title}`);
        btn.innerHTML = `<img src="${item.file}" alt="${item.title} thumbnail" />`;
        btn.addEventListener("click", () => {
          index = i;
          render();
          restart();
        });
        thumbs.appendChild(btn);
      });

      next.addEventListener("click", () => go(1));
      prev.addEventListener("click", () => go(-1));
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") go(1);
        if (event.key === "ArrowLeft") go(-1);
      });

      render();
      restart();
    </script>
  </body>
</html>
